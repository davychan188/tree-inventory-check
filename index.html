<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>Tree Inventory Auto Check</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<style>
:root{--g:#14532d;--bg:#f3f6f3;--line:#d5e0d5;--ok:#166534;--bad:#b91c1c}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang HK",sans-serif;background:var(--bg);color:#0f172a}
header{background:var(--g);color:#fff;padding:16px 20px}
header h1{margin:0;font-size:18px}
header p{margin:4px 0 0;opacity:.85;font-size:13px}
.wrap{max-width:1200px;margin:0 auto;padding:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
.card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.drop{border:2px dashed var(--line);border-radius:12px;padding:12px;margin-top:4px;background:#f8faf8;font-size:12px;color:#475569;text-align:center;cursor:pointer}
.drop.over{border-color:var(--g);background:#ecfdf3}
.drop .title{font-weight:700;font-size:13px;color:#0f172a;margin-bottom:4px}
.drop .fname{font-size:12px;color:#64748b;margin-top:8px;word-break:break-all}
.drop .fname.empty{color:#94a3b8}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.btn{border:0;background:var(--g);color:#fff;font-weight:800;padding:10px 14px;border-radius:12px;cursor:pointer;font-size:14px}
.btn:disabled{background:#94a3b8;cursor:not-allowed}
.btn2{background:#e2e8f0;color:#334155}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:#fff;border-radius:12px;padding:12px;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.kpi b{display:block;font-size:22px;color:var(--g)}
.kpi span{font-size:12px;color:#64748b}
.ok{color:var(--ok);font-weight:700}
.bad{color:var(--bad);font-weight:700}
.note{color:#64748b;font-size:13px}
h2{font-size:14px;margin:16px 0 8px;border-bottom:1px solid var(--line);padding-bottom:4px;color:#0f172a}
.table-wrap{overflow:auto;margin:8px 0 16px;background:#fff;border:1px solid var(--line);border-radius:10px;max-height:min(70vh,640px)}
table.excel{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:12px;background:#fff}
table.excel th,table.excel td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top;white-space:nowrap;background:#fff;color:#000}
table.excel th{background:#ecf3ec;color:#0f172a;font-weight:700;position:sticky;top:0;z-index:2;box-shadow:0 1px 0 var(--line)}
table.excel tbody tr:nth-child(even) td{background:#fafdfa}
table.excel td.changed{background:#fff2cc;color:#000;font-weight:600}
table.excel td.same{color:#000;background:#fff}
table.excel th.sub{background:#e2efe2;font-weight:600;font-size:12px;top:28px}
table.excel td.tree-no{position:sticky;left:0;background:#fafdfa;z-index:1;font-weight:700;color:#000;box-shadow:2px 0 0 var(--line)}
table.excel tbody tr:nth-child(even) td.tree-no{background:#f3f8f3}
table.excel .corner{background:#ecf3ec;z-index:4}
.excel-caption{font-size:12px;color:#64748b;margin:4px 0 8px}
.section-actions{margin:8px 0 4px}
.btn-sm{border:0;background:var(--g);color:#fff;font-weight:700;padding:8px 12px;border-radius:10px;cursor:pointer;font-size:13px}
.btn-sm:disabled{background:#94a3b8;cursor:not-allowed}
label.card-label{font-size:13px;font-weight:700;display:block;margin-bottom:6px}
.hint{font-size:12px;color:#64748b;margin-top:4px}
</style>
</head>
<body>
<header>
  <h1>Tree Inventory 自動檢查 / 年份對比</h1>
  <p>單檔檢查只讀「新年 Excel」格（含 Health／Form 都是 Poor）。對比要舊年、新年兩格都有檔。</p>
</header>
<div class="wrap">
  <div class="grid">
    <div class="card">
      <label class="card-label">舊年 Excel</label>
      <div class="drop" id="dropA">
        <div class="title">拖放或點擊選擇</div>
        <div class="fname empty" id="nameA">尚未選擇</div>
      </div>
      <div class="hint">可選；對比時必填</div>
    </div>
    <div class="card">
      <label class="card-label">新年 Excel</label>
      <div class="drop" id="dropB">
        <div class="title">拖放或點擊選擇</div>
        <div class="fname empty" id="nameB">尚未選擇</div>
      </div>
      <div class="hint">單檔檢查只讀此格</div>
    </div>
  </div>
  <input type="file" id="fileA" accept=".xlsx,.xls" hidden>
  <input type="file" id="fileB" accept=".xlsx,.xls" hidden>
  <div class="btns">
    <button class="btn" id="btnCompare" disabled>開始對比</button>
    <button class="btn btn2" id="btnSingle" disabled>單檔檢查（新年）</button>
  </div>
  <div id="out"></div>
</div>
<script>
const dropA = document.getElementById('dropA');
const dropB = document.getElementById('dropB');
const fileA = document.getElementById('fileA');
const fileB = document.getElementById('fileB');
const nameA = document.getElementById('nameA');
const nameB = document.getElementById('nameB');
const btnCompare = document.getElementById('btnCompare');
const btnSingle = document.getElementById('btnSingle');
const out = document.getElementById('out');

let bufA = null, bufB = null, fileNameA = '', fileNameB = '';

function num(v) {
  const n = parseFloat(String(v ?? '').replace(/,/g, ''));
  return isNaN(n) ? 0 : n;
}
function s(v) { return String(v ?? '').trim(); }
function esc(v) { return s(v).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function normNo(v) { return s(v).toUpperCase(); }

const FIELD_LABELS = {
  no: 'Tree No',
  sp: 'Species',
  h: 'Height',
  agg: 'Agg. DBH',
  triage: 'Triage',
  status: 'Status',
  rem: 'Remedial',
  others: 'Others',
  spread: 'Spread',
  trunk: 'Trunk',
  overall: 'Overall',
  health: 'Health',
  form: 'Form',
  reason: 'Reason',
  cavity: 'Cavity',
  lean: 'Lean',
  planting: 'Planting location',
};

function updateButtons() {
  const hasA = !!bufA;
  const hasB = !!bufB;
  btnCompare.disabled = !(hasA && hasB);
  btnSingle.disabled = !hasB; // 單檔 = 新年 Excel only
}

function wireDrop(dropEl, inputEl, which) {
  dropEl.onclick = () => inputEl.click();
  dropEl.ondragover = e => { e.preventDefault(); dropEl.classList.add('over'); };
  dropEl.ondragleave = () => dropEl.classList.remove('over');
  dropEl.ondrop = e => {
    e.preventDefault();
    dropEl.classList.remove('over');
    if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0], which);
  };
  inputEl.onchange = () => { if (inputEl.files[0]) loadFile(inputEl.files[0], which); };
}

function loadFile(file, which) {
  const reader = new FileReader();
  reader.onload = e => {
    if (which === 'A') {
      bufA = e.target.result;
      fileNameA = file.name;
      nameA.textContent = file.name;
      nameA.classList.remove('empty');
    } else {
      bufB = e.target.result;
      fileNameB = file.name;
      nameB.textContent = file.name;
      nameB.classList.remove('empty');
    }
    updateButtons();
    // Auto single-check only when 新年 Excel is set (and no compare pair yet)
    if (bufB && !bufA) {
      runSingle();
    }
  };
  reader.readAsArrayBuffer(file);
}

wireDrop(dropA, fileA, 'A');
wireDrop(dropB, fileB, 'B');
btnCompare.onclick = () => runCompare();
btnSingle.onclick = () => runSingle();

function findCol(headers, pred) {
  for (let i = 0; i < headers.length; i++) {
    if (pred(headers[i], i)) return i;
  }
  return -1;
}

function pickHealthForm(headers) {
  const healthIdx = findCol(headers, h => {
    const t = h.toLowerCase();
    if (!/health/i.test(t)) return false;
    if (/form\s*2/i.test(t)) return false;
    return true;
  });
  let formIdx = findCol(headers, h => {
    const t = h.toLowerCase();
    if (/form\s*2/i.test(t)) return false;
    if (/remedial/i.test(t)) return false;
    if (/^\s*form\s*$/i.test(h) || /form\s*condition/i.test(t)) return true;
    return false;
  });
  if (formIdx < 0) {
    formIdx = findCol(headers, h => {
      const t = h.toLowerCase();
      if (/form\s*2/i.test(t)) return false;
      if (/remedial/i.test(t)) return false;
      return /structural\s*condition/i.test(t) || /\bform\b/i.test(t);
    });
  }
  return { healthIdx, formIdx };
}

function getHeaderVal(rowObj, names) {
  for (const n of names) {
    if (rowObj[n] !== undefined && s(rowObj[n]) !== '') return rowObj[n];
  }
  // case-insensitive / partial
  const keys = Object.keys(rowObj);
  for (const want of names) {
    const w = want.toLowerCase();
    const k = keys.find(x => x.toLowerCase() === w || x.toLowerCase().startsWith(w));
    if (k) return rowObj[k];
  }
  return '';
}

function isInventoryTreeNo(no) {
  return /^[A-Za-z]{1,6}-?T\d+/i.test(no) || /^YO-/i.test(no);
}
function isAssessmentTreeNo(no) {
  return /^[A-Za-z]{1,6}\d+/i.test(no);
}

/** Parse Excel arrayBuffer → tree objects keyed fields */
function parseTrees(arrayBuffer) {
  const wb = XLSX.read(arrayBuffer, { type: 'array' });
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const raw = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });

  // --- Primary: inventory export (tree no + triage) ---
  let headerRow = -1;
  for (let i = 0; i < Math.min(raw.length, 30); i++) {
    const joined = raw[i].map(x => String(x).toLowerCase()).join(' ');
    if (joined.includes('tree no') && joined.includes('triage')) { headerRow = i; break; }
  }

  if (headerRow >= 0) {
    const headers = raw[headerRow].map(x => s(x));
    const { healthIdx, formIdx } = pickHealthForm(headers);
    const rows = raw.slice(headerRow + 1).map(r => {
      const o = {};
      headers.forEach((h, i) => o[h] = r[i]);
      return o;
    }).filter(r => isInventoryTreeNo(s(r['Tree No'])));

    const cavityIdx = findCol(headers, h => /cavity/i.test(h));
    const leanIdx = findCol(headers, h => /\blean\b/i.test(h));
    const remarksIdx = findCol(headers, h => /remarks?|defect/i.test(h));
    let plantingIdx = findCol(headers, h => /planting\s*location/i.test(h));
    if (plantingIdx < 0) plantingIdx = findCol(headers, h => /^location$/i.test(h));
    return rows.map(r => {
      const arr = headers.map((_, i) => r[headers[i]]);
      return {
        no: s(r['Tree No']),
        sp: s(r['Tree Species'] || r['Species'] || ''),
        h: num(r['Height (m)'] ?? r['Height']),
        spread: num(r['Crown Spread (m)'] ?? r['Spread (m)'] ?? r['Spread']),
        dbh: [num(r['DBH1 (mm)']), num(r['DBH2 (mm)']), num(r['DBH3 (mm)']), num(r['DBH4 (mm)']), num(r['DBH5 (mm)'])],
        agg: num(r['Aggregated DBH (mm)'] ?? r['DBH (mm)'] ?? r['DBH']),
        trunk: num(r['Trunk No.']),
        reason: s(r['Tree not inspected Reason']),
        triage: s(r['Triage Colour']),
        status: s(r['Tree Status']),
        overall: s(r['Overall Conditions']),
        rem: s(r['Remedial Action']),
        others: s(r['Remedial Action (Others)']),
        health: healthIdx >= 0 ? s(arr[healthIdx]) : s(getHeaderVal(r, ['Health Condition', 'Health Conditions', 'Health'])),
        form: formIdx >= 0 ? s(arr[formIdx]) : s(getHeaderVal(r, ['Form Condition', 'Form Conditions', 'Form', 'Structural Condition'])),
        cavity: cavityIdx >= 0 ? s(arr[cavityIdx]) : s(getHeaderVal(r, ['Cavity', 'Cavities'])),
        lean: leanIdx >= 0 ? s(arr[leanIdx]) : s(getHeaderVal(r, ['Lean', 'Leaning'])),
        remarks: remarksIdx >= 0 ? s(arr[remarksIdx]) : s(getHeaderVal(r, ['Remarks', 'Remark', 'Defect', 'Defects'])),
        planting: plantingIdx >= 0 ? s(arr[plantingIdx]) : s(getHeaderVal(r, ['Planting Location', 'Planting location', 'Location'])),
      };
    });
  }

  // --- Fallback: assessment schedule (Health Condition / Structural Condition) ---
  let assessHeader = -1;
  for (let i = 0; i < Math.min(raw.length, 40); i++) {
    const joined = raw[i].map(x => String(x).toLowerCase()).join(' | ');
    if (/tree\s*no/i.test(joined) && /health\s*condition/i.test(joined)) {
      assessHeader = i;
      break;
    }
  }
  if (assessHeader < 0) return [];

  const headers = raw[assessHeader].map(x => s(x).replace(/\s+/g, ' '));
  // Merge sub-header row if present (row+1 often has Height/Spread/DBH labels)
  const sub = (raw[assessHeader + 1] || []).map(x => s(x));
  const effective = headers.map((h, i) => {
    if (h) return h;
    return sub[i] || '';
  });
  // Prefer parent labels for Health/Structural even if blank in parent under Tree Size
  for (let i = 0; i < headers.length; i++) {
    if (headers[i]) effective[i] = headers[i];
  }

  const { healthIdx, formIdx } = pickHealthForm(effective.length ? effective : headers);
  // Also try original headers for Health Condition / Structural Condition
  let hIdx = healthIdx;
  let fIdx = formIdx;
  if (hIdx < 0) hIdx = findCol(headers, h => /health\s*condition/i.test(h));
  if (fIdx < 0) fIdx = findCol(headers, h => /structural\s*condition/i.test(h) || (/^\s*form\s*$/i.test(h)));

  const treeNoIdx = findCol(headers, h => /tree\s*no/i.test(h));
  const speciesIdx = findCol(headers, h => /^species$/i.test(h) || /scientific\s*name/i.test(h));
  // Height/Spread/DBH often on sub-row
  let heightIdx = findCol(effective, h => /height/i.test(h));
  if (heightIdx < 0) heightIdx = findCol(sub, h => /height/i.test(h));
  let spreadIdx = findCol(effective, h => /spread/i.test(h));
  if (spreadIdx < 0) spreadIdx = findCol(sub, h => /spread/i.test(h));
  let dbhIdx = findCol(effective, h => /\bdbh\b/i.test(h));
  if (dbhIdx < 0) dbhIdx = findCol(sub, h => /\bdbh\b/i.test(h));
  // Scientific name often col after Tree No blank col
  let sciIdx = findCol(sub, h => /scientific/i.test(h));
  if (sciIdx < 0 && speciesIdx >= 0) sciIdx = speciesIdx;

  const dataStart = assessHeader + 1;
  // skip blank / subheader rows until we hit a tree no
  const trees = [];
  for (let r = dataStart; r < raw.length; r++) {
    const row = raw[r];
    const no = s(row[treeNoIdx >= 0 ? treeNoIdx : 0]);
    if (!no) continue;
    if (!isAssessmentTreeNo(no) && !isInventoryTreeNo(no)) continue;
    // skip legend-like rows
    if (/legend|dead tree|venue|prepared/i.test(no)) continue;
    const sp = s(row[sciIdx >= 0 ? sciIdx : (speciesIdx >= 0 ? speciesIdx : 2)]);
    const h = heightIdx >= 0 ? num(row[heightIdx]) : 0;
    const spread = spreadIdx >= 0 ? num(row[spreadIdx]) : 0;
    const dbhVal = dbhIdx >= 0 ? num(row[dbhIdx]) : 0;
    trees.push({
      no,
      sp,
      h,
      spread,
      dbh: [dbhVal, 0, 0, 0, 0],
      agg: dbhVal,
      trunk: 0,
      reason: '',
      triage: '',
      status: '',
      overall: '',
      rem: '',
      others: '',
      health: hIdx >= 0 ? s(row[hIdx]) : '',
      form: fIdx >= 0 ? s(row[fIdx]) : '',
      cavity: '',
      lean: '',
      remarks: '',
      planting: '',
    });
  }
  return trees;
}

function badge(n, okZero = true) {
  return `<span class="${(okZero ? n === 0 : n > 0) ? 'ok' : 'bad'}">${n}</span>`;
}


function excelList(list, cols, emptyMsg = '無') {
  const fieldCols = cols.filter(c => c !== 'no');
  const headers = ['no', ...fieldCols];
  const th = headers.map((c, i) => {
    const label = FIELD_LABELS[c] || c;
    const cls = i === 0 ? ' class="corner"' : '';
    return `<th${cls}>${esc(label)}</th>`;
  }).join('');
  if (!list.length) {
    const colspan = headers.length;
    return `<div class="table-wrap"><table class="excel"><thead><tr>${th}</tr></thead><tbody><tr><td colspan="${colspan}">${esc(emptyMsg)}</td></tr></tbody></table></div>`;
  }
  const body = list.map(t => {
    const cells = headers.map((c, i) => {
      const cls = i === 0 ? ' class="tree-no"' : '';
      const val = i === 0 ? s(t.no) : dispVal(t[c]);
      return `<td${cls}>${esc(val)}</td>`;
    }).join('');
    return `<tr>${cells}</tr>`;
  }).join('');
  return `<div class="table-wrap"><table class="excel"><thead><tr>${th}</tr></thead><tbody>${body}</tbody></table></div>`;
}



function countBySpecies(trees) {
  const map = new Map();
  for (const t of trees) {
    const sp = s(t.sp);
    if (!sp) continue; // skip empty for species summaries
    map.set(sp, (map.get(sp) || 0) + 1);
  }
  return [...map.entries()]
    .map(([species, qty]) => ({ species, qty }))
    .sort((a, b) => b.qty - a.qty || a.species.localeCompare(b.species));
}

function speciesCountTable(rows, emptyMsg = '無') {
  const th = `<th class="corner">Species</th><th>Quantity (no)</th>`;
  if (!rows.length) {
    return `<div class="table-wrap"><table class="excel"><thead><tr>${th}</tr></thead><tbody><tr><td colspan="2">${esc(emptyMsg)}</td></tr></tbody></table></div>`;
  }
  const body = rows.map(r =>
    `<tr><td class="tree-no">${esc(r.species)}</td><td>${esc(r.qty)}</td></tr>`
  ).join('');
  return `<div class="table-wrap"><table class="excel"><thead><tr>${th}</tr></thead><tbody>${body}</tbody></table></div>`;
}

function bothPoor(trees) {
  return trees.filter(t => /^poor$/i.test(t.health) && /^poor$/i.test(t.form));
}

/** Exclude Removed / Tree not inspect from year compare */
function isOutOfCompare(t) {
  const r = s(t.reason);
  const blob = `${r} ${s(t.status)} ${s(t.overall)}`;
  if (/removed/i.test(blob)) return true;
  if (/not\s*inspect/i.test(blob)) return true;
  // non-empty Tree not inspected Reason = not inspected
  if (r !== '') return true;
  return false;
}

/** Section 11 only: Tree not inspected, excluding Removed */
function isTreeNotInspected(t) {
  const r = s(t.reason);
  const blob = `${r} ${s(t.status)} ${s(t.overall)}`;
  if (/removed/i.test(blob)) return false;
  if (/not\s*inspect/i.test(blob)) return true;
  if (r !== '') return true;
  return false;
}


function isForm2(t) {
  return /form\s*2/i.test(s(t.rem));
}

function triageBucket(t) {
  const tri = s(t.triage);
  if (/black/i.test(tri)) return 'Black';
  if (/red/i.test(tri)) return 'Red';
  if (/orange/i.test(tri)) return 'Orange';
  if (/yellow/i.test(tri)) return 'Yellow';
  return 'Non-coloured';
}

function buildForm2TriageSummary(trees) {
  const order = ['Black', 'Red', 'Orange', 'Yellow', 'Non-coloured'];
  const buckets = Object.fromEntries(order.map(k => [k, { withMit: 0, noMit: 0 }]));
  for (const t of trees) {
    if (!isForm2(t)) continue;
    const b = triageBucket(t);
    if (s(t.others) !== '') buckets[b].withMit++;
    else buckets[b].noMit++;
  }
  const rows = order.map(triage => {
    const withMit = buckets[triage].withMit;
    const noMit = buckets[triage].noMit;
    return {
      triage,
      status: '',
      subTotal: withMit + noMit,
      withMit,
      noMit,
    };
  });
  const totalWith = rows.reduce((a, r) => a + r.withMit, 0);
  const totalNo = rows.reduce((a, r) => a + r.noMit, 0);
  rows.push({
    triage: 'Total no. of FORM 2',
    status: '',
    subTotal: totalWith + totalNo,
    withMit: totalWith,
    noMit: totalNo,
    isTotal: true,
  });
  return rows;
}

function form2TriageTable(rows) {
  const th = [
    'TRIAGE Classification',
    'Status',
    'Sub-Total (no)',
    'With mitigation works',
    'No mitigation work',
  ].map((label, i) => `<th${i === 0 ? ' class="corner"' : ''}>${esc(label)}</th>`).join('');
  const body = rows.map(r => {
    const statusCell = r.status === '' ? '—' : esc(r.status);
    const cls = r.isTotal ? ' style="font-weight:700"' : '';
    return `<tr${cls}><td class="tree-no">${esc(r.triage)}</td><td>${statusCell}</td><td>${r.subTotal}</td><td>${r.withMit}</td><td>${r.noMit}</td></tr>`;
  }).join('');
  return `<div class="table-wrap"><table class="excel"><thead><tr>${th}</tr></thead><tbody>${body}</tbody></table></div>`;
}


function isTruthyFlag(v) {
  const t = s(v);
  if (t === '') return false;
  if (/^(n|no|0|-|n\.?a\.?|na|nil|none|無|否)$/i.test(t)) return false;
  return true;
}

function treeBlob(t) {
  return [t.cavity, t.lean, t.status, t.overall, t.rem, t.others, t.reason, t.health, t.form, t.remarks]
    .map(s).join(' ');
}

function hasCavity(t) {
  if (isTruthyFlag(t.cavity)) return true;
  return /cavity/i.test(treeBlob(t));
}

function hasLean(t) {
  if (isTruthyFlag(t.lean)) return true;
  return /\blean\b/i.test(treeBlob(t));
}


function isKerbPlanterConfined(v) {
  return /kerb\s*planter\s*\(\s*confined\s*\)/i.test(s(v));
}

let lastSingleSummary = null;

function renderSingle(trees, fileLabel) {
  const removed = trees.filter(t => /removed/i.test(t.reason));
  const active = trees.filter(t => !/removed/i.test(t.reason));
  const isLarge = t => t.agg >= 500 || t.h >= 9;
  const large = active.filter(isLarge);
  const miss = large.filter(t => !['Yellow', 'Orange'].includes(t.triage));
  // 高度 <9 且 Agg.DBH <500，但 Triage 為 Yellow / Orange / Red
  const smallYor = active.filter(t => t.h < 9 && t.agg < 500 && /^(Yellow|Orange|Red)$/i.test(t.triage));
  const yBad = trees.filter(t => t.triage === 'Yellow' && !/Large Tree/i.test(t.status));
  const oBad = trees.filter(t => t.triage === 'Orange' && /Large\s*Tree/i.test(t.status) && !isKerbPlanterConfined(t.planting));
  const yo = trees.filter(t => ['Yellow', 'Orange'].includes(t.triage));
  const badRem = yo.filter(t => !['Form 2 Assessment', 'Others'].includes(t.rem));
  const badOth = yo.filter(t => t.rem === 'Others' && !/reinspection/i.test(t.others));
  const poor = trees.filter(t => /^poor$/i.test(t.overall));
  const remBad = removed.filter(t => !(t.h === 0 && t.spread === 0 && t.dbh.every(x => x === 0) && t.agg === 0 && t.trunk === 0));
  const dbh95 = active.filter(t => t.agg >= 95);
  const yN = trees.filter(t => t.triage === 'Yellow').length;
  const oN = trees.filter(t => t.triage === 'Orange').length;
  const hfPoor = bothPoor(trees);
  const cavityList = trees.filter(hasCavity);
  const leanList = trees.filter(hasLean);
  // Tree not inspected only (exclude Removed; Top5/Mature/compare still use isOutOfCompare)
  const notInspectedList = trees.filter(isTreeNotInspected);
  // Top 5: all trees except Removed / Tree not inspected (via reason); no H/DBH filter
  const forTop5Species = trees.filter(t => !isOutOfCompare(t));
  const top5Species = countBySpecies(forTop5Species).slice(0, 5);
  // Mature: DBH >500 and exclude not inspected / removed
  const matureTrees = trees.filter(t => !isOutOfCompare(t) && t.agg > 500);

    { title: '4. Yellow/Orange Remedial 不是 Form 2 / Others', sheetName: '4 Rem not Form2', cols: ['no', 'triage', 'rem'], list: badRem },
    { title: '5. Others 不是 Reinspection within 12 months', sheetName: '5 Others not Reinsp', cols: ['no', 'others'], list: badOth },
    { title: '6. Removed 量度不是全 0', sheetName: '6 Removed not 0', cols: ['no', 'h', 'spread', 'agg', 'trunk'], list: remBad },
    { title: '7. Overall Conditions = Poor', sheetName: '7 Overall Poor', cols: ['no', 'sp', 'overall', 'triage', 'h', 'agg'], list: poor },
    { title: '8. Health 與 Form 都是 Poor', sheetName: '8 Health Form Poor', cols: ['no', 'sp', 'health', 'form', 'triage', 'overall'], list: hfPoor },
    { title: '9. Cavity', sheetName: '9 Cavity', cols: ['no', 'sp', 'cavity', 'triage', 'overall'], list: cavityList },
    { title: '10. Lean', sheetName: '10 Lean', cols: ['no', 'sp', 'lean', 'triage', 'overall'], list: leanList },
    { title: '11. Tree not inspected', sheetName: '11 Not inspected', cols: ['no', 'sp', 'reason', 'status', 'triage'], list: notInspectedList },
  ];

  lastSingleSummary = {
    fileLabel,
    counts: {
      total: trees.length,
      active: active.length,
      removed: removed.length,
      dbh95: dbh95.length,
      yellow: yN,
      orange: oN,

    </div>

    <h2>Most common species (Top 5)　${badge(top5Species.length, false)}</h2>
    <p class="note">已排除 Tree not inspected Reason（Removed／undersize／not inspect 等）；唔再按高度／DBH 篩選；計全部其餘樹</p>
    ${speciesCountTable(top5Species, '無物種資料')}
    <h2>Mature trees (DBH &gt;500mm)　${badge(matureTrees.length, false)}</h2>

    ${speciesCountTable(matureBySpecies, '無 Mature trees (DBH &gt;500mm)')}
    <h2>Trees in FORM 2　${badge(form2Total, false)}</h2>
    <p class="note">Form 2 = Remedial Action 含 Form 2；mitigation = Remedial Action (Others) 有內容；Non-coloured = 無 Black/Red/Orange/Yellow triage</p>
    ${form2TriageTable(form2TriageRows)}
    <h2>1. Large tree 未標 Yellow / Orange　${badge(miss.length)}</h2>
    ${excelList(miss, ['no', 'sp', 'h', 'agg', 'triage', 'status'])}
    <h2>1b. 非 Large（H&lt;9 且 DBH&lt;500）但 Triage 為 Yellow／Orange／Red　${badge(smallYor.length)}</h2>

    <h2>2. Yellow Status 不是 Large Tree　${badge(yBad.length)}</h2>

    <h2>3. Orange + Large Tree 但 Planting location 不是 KERB PLANTER (CONFINED)　${badge(oBad.length)}</h2>

    <h2>4. Yellow/Orange Remedial 不是 Form 2 / Others　${badge(badRem.length)}</h2>
    ${excelList(badRem, ['no', 'triage', 'rem'])}
    <h2>5. Others 不是 Reinspection within 12 months　${badge(badOth.length)}</h2>
    ${excelList(badOth, ['no', 'others'])}
    <h2>6. Removed 量度不是全 0　${badge(remBad.length)}</h2>
    <p class="note">Removed 共 ${removed.length} 棵，只檢查 Height / Spread / DBH1–5 / Agg. DBH / Trunk No. 是否全為 0，不列出清單。</p>
    ${excelList(remBad, ['no', 'h', 'spread', 'agg', 'trunk'])}
    <h2>7. Overall Conditions = Poor　${badge(poor.length, false)}</h2>
    ${excelList(poor, ['no', 'sp', 'overall', 'triage', 'h', 'agg'], '無 Overall Poor')}
    <h2>8. Health 與 Form 都是 Poor　${badge(hfPoor.length, false)}</h2>
    ${excelList(hfPoor, ['no', 'sp', 'health', 'form', 'triage', 'overall'], '無 Health & Form 都是 Poor')}
    <h2>9. Cavity　${badge(cavityList.length, false)}</h2>
    ${excelList(cavityList, ['no', 'sp', 'cavity', 'triage', 'overall'], '無 Cavity')}
    <h2>10. Lean　${badge(leanList.length, false)}</h2>
    ${excelList(leanList, ['no', 'sp', 'lean', 'triage', 'overall'], '無 Lean')}
    <h2>11. Tree not inspected　${badge(notInspectedList.length, false)}</h2>
    <p class="note">列出 Tree not inspected Reason 有內容，或 Status／Overall／Reason 含 not inspect 嘅樹號（唔包括 Removed）</p>
    ${excelList(notInspectedList, ['no', 'sp', 'reason', 'status', 'triage'], '無 Tree not inspected')}
  `;
}

function valEq(a, b) {
  // numeric-ish compare when both parse as numbers
  const na = parseFloat(String(a ?? '').replace(/,/g, ''));
  const nb = parseFloat(String(b ?? '').replace(/,/g, ''));
  if (!isNaN(na) && !isNaN(nb) && String(a).trim() !== '' && String(b).trim() !== '') {
    return na === nb;
  }
  return s(a) === s(b);
}

const COMPARE_FIELDS = [
  { key: 'sp', label: 'Species' },
  { key: 'h', label: 'Height' },
  { key: 'agg', label: 'Agg. DBH' },
  { key: 'triage', label: 'Triage' },
  { key: 'status', label: 'Status' },
  { key: 'overall', label: 'Overall' },
  { key: 'health', label: 'Health' },
  { key: 'form', label: 'Form' },
  { key: 'rem', label: 'Remedial' },
  { key: 'reason', label: 'Reason' },
];

let lastChangedForExcel = [];

function dispVal(v) {
  const t = s(v);
  return t === '' ? '（空）' : t;
}

function changeCell(tA, tB, key) {
  if (valEq(tA[key], tB[key])) return { html: '<span class="same">—</span>', cls: 'same', text: '—' };
  const txt = `${dispVal(tA[key])} → ${dispVal(tB[key])}`;
  return { html: esc(txt), cls: 'changed', text: txt };
}

function buildChangeTable(changed) {
  if (!changed.length) {
    return `<div class="table-wrap"><table class="excel"><thead><tr><th>Tree No</th></tr></thead><tbody><tr><td>無欄位變動</td></tr></tbody></table></div>`;
  }
  // Excel-style: Tree No + each field as 舊 / 新 columns
  const top = [`<th class="corner" rowspan="2">Tree No</th>`]
    .concat(COMPARE_FIELDS.map(f => `<th colspan="2">${esc(f.label)}</th>`))
    .join('');
  const sub = COMPARE_FIELDS.map(() => `<th class="sub">舊</th><th class="sub">新</th>`).join('');
  const body = changed.map(c => {
    const cells = [`<td class="tree-no">${esc(c.no)}</td>`];
    for (const f of COMPARE_FIELDS) {
      const same = valEq(c.tA[f.key], c.tB[f.key]);
      const cls = same ? 'same' : 'changed';
      cells.push(`<td class="${cls}">${esc(dispVal(c.tA[f.key]))}</td>`);
      cells.push(`<td class="${cls}">${esc(dispVal(c.tB[f.key]))}</td>`);
    }
    return `<tr>${cells.join('')}</tr>`;
  }).join('');
  return `<p class="excel-caption">網頁以 Excel 列表顯示（每欄分舊／新；黃色＝有變動）</p><div class="table-wrap"><table class="excel"><thead><tr>${top}</tr><tr>${sub}</tr></thead><tbody>${body}</tbody></table></div>`;
}

function downloadChangedExcel() {
  if (!lastChangedForExcel.length) return;
  const rows = lastChangedForExcel.map(c => {
    const row = { 'Tree No': c.no };
    for (const f of COMPARE_FIELDS) {
      row[`${f.label}舊`] = s(c.tA[f.key]);
      row[`${f.label}新`] = s(c.tB[f.key]);
    }
    return row;
  });
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '欄位有變');
  XLSX.writeFile(wb, '欄位有變.xlsx');
}

function cellVal(t, key) {
  const v = t[key];
  if (typeof v === 'number' && !Number.isNaN(v)) return v;
  return s(v);
}

function treesToSheetRows(list, cols) {
  return list.map(t => {
    const row = {};
    for (const c of cols) {
      row[FIELD_LABELS[c] || c] = cellVal(t, c);
    }
    return row;
  });
}

function safeSheetName(name) {
  return s(name).replace(/[:\\/?*\[\]]/g, '-').slice(0, 31) || 'Sheet';
}

const EXCEL_BORDER = { style: 'thin', color: { argb: 'FFB0BEC5' } };
const EXCEL_THIN_BORDER = { top: EXCEL_BORDER, left: EXCEL_BORDER, bottom: EXCEL_BORDER, right: EXCEL_BORDER };
const CHECK_SHEET_HEADER_COLORS = {
  '1 Large no YO': 'F57C00',
  '1b Small YOR': 'F9A825',
  '2 Yellow not Large': 'F9A825',
  '3 Orange Large not Kerb': 'E65100',
  '4 Rem not Form2': 'E65100',
  '5 Others not Reinsp': 'C62828',
  '6 Removed not 0': 'C62828',
  '7 Overall Poor': 'AD1457',
  '8 Health Form Poor': 'AD1457',
  '9 Cavity': 'AD1457',
  '10 Lean': '455A64',
  '11 Not inspected': '455A64',
};
const CHECK_CENTER_FIELDS = new Set(['h', 'agg', 'spread', 'trunk']);
const COPY_LIST_HEADER = '可複製 Tree No 清單';

function excelArgb(hex) {
  let h = String(hex || '').replace(/^#/, '').toUpperCase();
  if (h.length === 8) h = h.slice(-6);
  if (h.length !== 6) h = h.padStart(6, '0').slice(-6);
  return 'FF' + h;
}

function styleHeaderCell(cell, fillHex) {
  cell.font = { name: 'Arial', size: 11, bold: true, color: { argb: 'FFFFFFFF' } };
  cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: excelArgb(fillHex) } };
  cell.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
  cell.border = EXCEL_THIN_BORDER;
}

function styleDataCell(cell, { align = 'left', bold = false, fillHex = null, numFmt = null } = {}) {
  cell.font = { name: 'Arial', size: 10, bold: !!bold, color: { argb: 'FF000000' } };
  cell.alignment = { horizontal: align, vertical: 'middle', wrapText: !!fillHex };
  cell.border = EXCEL_THIN_BORDER;
  if (fillHex) {
    cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: excelArgb(fillHex) } };
  }
  if (numFmt) cell.numFmt = numFmt;
}

function colWidthForField(key) {
  if (key === 'no') return 14;
  if (key === 'sp') return 50;
  if (key === 'planting') return 20;
  if (key === 'status') return 16;
  if (key === 'reason') return 18;
  if (key === 'rem' || key === 'others') return 20;
  return 13;
}

function triggerXlsxDownload(buffer, filename) {
  const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function downloadSingleSummary() {
  if (!lastSingleSummary) return;
  if (typeof ExcelJS === 'undefined' || !ExcelJS.Workbook) {

    wb.creator = 'Tree Inventory Auto Check';

    // 1. Summary
    {

      ];
      top5Species.forEach((r, i) => {

      for (const sec of sections) {
        summaryRows.push([sec.title, sec.list.length]);
      }
      summaryRows.forEach((pair, i) => {
        const r = i + 2;
        const itemCell = ws.getCell(r, 1);
        const countCell = ws.getCell(r, 2);
        itemCell.value = pair[0];
        countCell.value = pair[1];
        const countIsNum = typeof pair[1] === 'number';

        styleDataCell(countCell, { align: countIsNum ? 'center' : 'left' });
      });
      ws.getColumn(1).width = 75;
      ws.getColumn(2).width = 74;
    }

    // 2. Top 5 Species
    if (top5Species.length) {

      ws.getRow(1).height = 22;
      styleHeaderCell(ws.getCell(1, 1), '2E7D32');
      styleHeaderCell(ws.getCell(1, 2), '2E7D32');
      ws.getCell(1, 1).value = 'Species';
      ws.getCell(1, 2).value = 'Quantity (no)';
      top5Species.forEach((row, i) => {
        const r = i + 2;
        ws.getCell(r, 1).value = row.species;
        ws.getCell(r, 2).value = row.qty;
        styleDataCell(ws.getCell(r, 1), { align: 'left' });

      });

      ws.getColumn(2).width = 16;
    }

    // 3. Mature DBH gt 500
    if (matureBySpecies.length) {
      const ws = wb.addWorksheet(safeSheetName('Mature DBH gt 500'), { views: [{ state: 'frozen', ySplit: 1 }] });
      ws.getRow(1).height = 22;
      styleHeaderCell(ws.getCell(1, 1), '00695C');
      styleHeaderCell(ws.getCell(1, 2), '00695C');
      ws.getCell(1, 1).value = 'Species';
      ws.getCell(1, 2).value = 'Quantity (no)';
      matureBySpecies.forEach((row, i) => {

        ws.getCell(r, 2).value = row.qty;

      });
      ws.getColumn(1).width = 69;
      ws.getColumn(2).width = 16;
    }

    // 4. FORM 2 triage
    if (form2TriageRows.length) {
      const ws = wb.addWorksheet(safeSheetName('FORM 2 triage'), { views: [{ state: 'frozen', ySplit: 1 }] });
      ws.getRow(1).height = 22;
      const headers = ['TRIAGE Classification', 'Status', 'Sub-Total (no)', 'With mitigation works', 'No mitigation work'];
      headers.forEach((h, i) => {
        const cell = ws.getCell(1, i + 1);
        cell.value = h;
        styleHeaderCell(cell, '6A1B9A');
      });
      form2TriageRows.forEach((row, i) => {

          row.status === '' || row.status == null ? '—' : row.status,

      ws.getColumn(5).width = 21;
    }

    // 5+. Non-empty check sheets
    for (const sec of sections) {
      if (!sec.list.length) continue;
      const name = safeSheetName(sec.sheetName);
      const headerFill = CHECK_SHEET_HEADER_COLORS[sec.sheetName] || 'F57C00';
      const ws = wb.addWorksheet(name, { views: [{ state: 'frozen', ySplit: 1 }] });

      cols.forEach((key, i) => {

      const spIdx = cols.indexOf('sp');
      if (spIdx >= 0) {
        const maxLen = Math.max(

          ...sec.list.map(t => s(t.sp).length)

      }
      ws.getColumn(7).width = 13;
      ws.getColumn(8).width = 80;
    }

    const base = s(fileLabel).replace(/\.[^.]+$/, '').replace(/[\\/:*?"<>|]/g, '_') || '單檔檢查';
    const buffer = await wb.xlsx.writeBuffer();
    triggerXlsxDownload(buffer, `${base}_summary.xlsx`);
  } catch (err) {
    alert('下載 Excel summary 失敗：' + (err && err.message ? err.message : err));
  }
}


function renderCompare(treesA, treesB, nameOld, nameNew) {
  const a = treesA.filter(t => !isOutOfCompare(t));
  const b = treesB.filter(t => !isOutOfCompare(t));
  const excludedA = treesA.length - a.length;
  const excludedB = treesB.length - b.length;

  const mapA = new Map();
  const mapB = new Map();
  a.forEach(t => mapA.set(normNo(t.no), t));
  b.forEach(t => mapB.set(normNo(t.no), t));

  const onlyA = [];
  const onlyB = [];
  const changed = [];

  for (const [k, t] of mapA) {
    if (!mapB.has(k)) onlyA.push(t);
  }
  for (const [k, t] of mapB) {
    if (!mapA.has(k)) onlyB.push(t);
  }
  for (const [k, tB] of mapB) {
    const tA = mapA.get(k);
    if (!tA) continue;
    const diffs = [];
    for (const f of COMPARE_FIELDS) {
      if (!valEq(tA[f.key], tB[f.key])) {
        diffs.push({ label: f.label, old: tA[f.key], neu: tB[f.key] });
      }
    }
    if (diffs.length) changed.push({ no: tB.no, diffs, tA, tB });
  }

  const hfPoor = bothPoor(b);

  lastChangedForExcel = changed;

  const dlBtn = changed.length
    ? `<div class="section-actions"><button type="button" class="btn-sm" id="btnDlChanged">下載 Excel</button></div>`
    : '';

  return `
    <p class="note">對比：舊年「${esc(nameOld)}」↔ 新年「${esc(nameNew)}」</p>
    <p class="note">對比已排除 Removed／Tree not inspect（舊年排除 ${excludedA}、新年排除 ${excludedB}）</p>
    <div class="kpis">
      <div class="kpi"><b>${a.length}</b><span>舊年樹數（對比）</span></div>
      <div class="kpi"><b>${b.length}</b><span>新年樹數（對比）</span></div>
      <div class="kpi"><b>${onlyA.length}</b><span>只在舊年</span></div>
      <div class="kpi"><b>${onlyB.length}</b><span>只在新年</span></div>
      <div class="kpi"><b>${changed.length}</b><span>有變動</span></div>
      <div class="kpi"><b>${hfPoor.length}</b><span>雙 Poor（新年）</span></div>
    </div>
    <h2>1. 只在舊年　${badge(onlyA.length, false)}</h2>
    ${excelList(onlyA, ['no', 'sp', 'health', 'form', 'triage', 'overall'], '無（舊年獨有）')}
    <h2>2. 只在新年　${badge(onlyB.length, false)}</h2>
    ${excelList(onlyB, ['no', 'sp', 'health', 'form', 'triage', 'overall'], '無（新年獨有）')}
    <h2>3. 欄位有變　${badge(changed.length, false)}</h2>
    ${dlBtn}
    ${buildChangeTable(changed)}
    <h2>4. Health 與 Form 都是 Poor（新年）　${badge(hfPoor.length, false)}</h2>
    ${excelList(hfPoor, ['no', 'sp', 'health', 'form', 'triage', 'overall'], '無 Health & Form 都是 Poor')}
  `;
}

function runSingle() {
  // 單檔檢查 = 新年 Excel only
  if (!bufB) return;
  try {
    const trees = parseTrees(bufB);
    out.innerHTML = renderSingle(trees, fileNameB);
    const dl = document.getElementById('btnDlSingleSummary');
    if (dl) dl.onclick = () => downloadSingleSummary();
  } catch (err) {
    out.innerHTML = `<p class="bad">讀取失敗：${esc(err.message || err)}</p>`;
  }
}

function runCompare() {
  if (!bufA || !bufB) return;
  try {
    const treesA = parseTrees(bufA);
    const treesB = parseTrees(bufB);
    out.innerHTML = renderCompare(treesA, treesB, fileNameA, fileNameB);
    const dl = document.getElementById('btnDlChanged');
    if (dl) dl.onclick = () => downloadChangedExcel();
  } catch (err) {
    out.innerHTML = `<p class="bad">對比失敗：${esc(err.message || err)}</p>`;
  }
}
</script>
